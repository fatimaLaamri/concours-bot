services:
  concours-bot:
    build: .
    container_name: concours-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data          # database + logs survive updates
      - ./sites.yaml:/app/sites.yaml   # edit sites without rebuilding
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
